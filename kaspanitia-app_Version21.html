<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KasPanitia Premium v21</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.1.1/jspdf.umd.min.js"></script>
    <style>
      :root {
        --bg: #f4f7f6;
        --panel: #ffffff;
        --soft: #f5faf8;
        --primary: #1e5b4d;
        --primary-2: #163f36;
        --primary-soft: #eaf4f1;
        --accent: #f4d66d;
        --text: #162321;
        --muted: #64756f;
        --line: #dfeae7;
        --success: #1f8e59;
        --danger: #d94c4c;
        --warning: #b57a1f;
        --info: #2d6ec8;
        --shadow: 0 16px 30px rgba(17, 34, 28, 0.08);
        --radius: 18px;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #eef5f2 0%, #f5f8f7 100%);
        color: var(--text);
      }

      .app-shell {
        max-width: 1200px;
        margin: 32px auto;
        padding: 0 20px 48px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 26px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand-badge {
        width: 62px;
        height: 62px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, var(--primary), var(--primary-2));
        color: white;
        font-weight: 800;
        font-size: 1.45rem;
        box-shadow: var(--shadow);
      }

      .brand-text strong {
        display: block;
        font-size: 1.2rem;
      }

      .brand-text small {
        color: var(--muted);
      }

      .right-tools {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .chip, .btn {
        border-radius: 12px;
        padding: 10px 14px;
        border: 1px solid var(--line);
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .chip {
        background: var(--panel);
        color: var(--muted);
      }

      .chip.primary {
        background: var(--primary-soft);
        color: var(--primary);
      }

      .btn {
        border: 1px solid var(--line);
      }

      .btn.secondary {
        background: var(--primary-soft);
        color: var(--primary);
      }

      .btn.danger {
        background: #fff0f0;
        color: var(--danger);
        border-color: #efcaca;
      }

      .btn:hover, .chip:hover {
        transform: translateY(-1px);
      }

      .header-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: 22px 22px 18px;
        margin-bottom: 20px;
      }

      .header-main {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
      }

      .title-wrap h1 {
        margin: 0;
        font-size: clamp(1.9rem, 3vw, 2.7rem);
      }

      .title-wrap p {
        margin: 8px 0 0;
        color: var(--muted);
      }

      .status-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .status-chip {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fafdfc;
        color: var(--muted);
        padding: 8px 12px;
        font-weight: 700;
      }

      .status-chip.active {
        background: var(--primary-soft);
        color: var(--primary);
        border-color: rgba(30,91,77,0.12);
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 16px;
        margin-top: 22px;
      }

      .stat-card {
        background: linear-gradient(180deg, #ffffff, #f3faf7);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
      }

      .stat-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }

      .stat-label {
        color: var(--muted);
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .stat-icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 1.1rem;
      }

      .stat-icon.green { background: #eafaf0; color: var(--success); }
      .stat-icon.red { background: #fdecec; color: var(--danger); }
      .stat-icon.blue { background: #edf4ff; color: var(--info); }
      .stat-icon.gold { background: #fff3df; color: var(--warning); }

      .stat-value {
        font-size: clamp(1.5rem, 2vw, 2rem);
        font-weight: 800;
      }

      .trend {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 12px;
        font-size: 0.76rem;
        font-weight: 700;
        padding: 6px 10px;
        border-radius: 999px;
      }

      .trend.up { background: #eafaf0; color: var(--success); }
      .trend.down { background: #fdecec; color: var(--danger); }

      .table-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .table-header {
        padding: 18px 20px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .table-header h3 {
        margin: 0;
        font-size: 1.15rem;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 760px;
      }

      th, td {
        text-align: left;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }

      th {
        background: #fafcfb;
        color: var(--muted);
        font-size: 0.75rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      tbody tr:hover { background: #fafdfb; }

      .badge {
        display: inline-flex;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
      }

      .badge.income { background: #eafaf0; color: var(--success); }
      .badge.expense { background: #fdecec; color: var(--danger); }
      .badge.transfer { background: #edf4ff; color: var(--info); }

      .money.in { color: var(--success); font-weight: 700; }
      .money.out { color: var(--danger); font-weight: 700; }

      @media (max-width: 680px) {
        .app-shell { padding: 0 14px 40px; }
        .header-main { align-items: flex-start; }
        .right-tools { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div class="topbar">
        <div class="brand">
          <div class="brand-badge">K</div>
          <div class="brand-text">
            <strong>KasPanitia</strong>
            <small>Finance Portal</small>
          </div>
        </div>

        <div class="right-tools">
          <div class="chip primary">Live Data</div>
          <div class="chip">Notifikasi</div>
          <button class="btn secondary" id="exportCsvBtn" type="button">Export CSV</button>
          <button class="btn secondary" id="downloadPdfBtn" type="button">Download PDF</button>
          <button class="btn danger" id="resetDataBtn" type="button">Reset Data</button>
        </div>
      </div>

      <div class="header-card">
        <div class="header-main">
          <div class="title-wrap">
            <h1>Dashboard Keuangan</h1>
            <p>Monitoring realisasi anggaran dan arus kas panitia</p>
          </div>

          <div class="status-row">
            <div class="status-chip active">Hari Ini</div>
            <div class="status-chip">Minggu Ini</div>
            <div class="status-chip">Bulan Ini</div>
          </div>
        </div>

        <div class="stats-grid" id="statsGrid"></div>
      </div>

      <div class="table-card">
        <div class="table-header">
          <h3>Daftar Transaksi</h3>
          <div class="chip primary">Versi 21</div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Tanggal</th>
                <th>Jenis</th>
                <th>Deskripsi</th>
                <th>Rekening</th>
                <th>Nominal</th>
              </tr>
            </thead>
            <tbody id="transactionTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const state = {
        transactions: [
          { date: "2026-10-21", type: "Pemasukan", description: "Donasi sponsor utama", account: "Kas Tunai", nominal: 2500000 },
          { date: "2026-10-20", type: "Pengeluaran", description: "Pembelian dekorasi acara", account: "Kas Tunai", nominal: 950000 },
          { date: "2026-10-19", type: "Pemasukan", description: "Setoran dari bendahara", account: "Rekening Bank", nominal: 1800000 },
          { date: "2026-10-18", type: "Transfer", description: "Pindah dana ke kebutuhan logistik", account: "Rekening Bank", nominal: 1200000 },
          { date: "2026-10-17", type: "Pengeluaran", description: "Honor panitia & dokumentasi", account: "Kas Tunai", nominal: 700000 },
          { date: "2026-10-16", type: "Pemasukan", description: "Pendapatan tiket/pendaftaran", account: "Rekening Bank", nominal: 3200000 }
        ]
      };

      const money = (value) => new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
      }).format(Number(value || 0));

      function renderSummary() {
        const totalPemasukan = state.transactions
          .filter(item => item.type === "Pemasukan")
          .reduce((sum, item) => sum + Number(item.nominal || 0), 0);

        const totalPengeluaran = state.transactions
          .filter(item => item.type === "Pengeluaran" || item.type === "Transfer")
          .reduce((sum, item) => sum + Number(item.nominal || 0), 0);

        const saldo = totalPemasukan - totalPengeluaran;

        const cards = [
          { label: "Total Pemasukan", icon: "green", value: money(totalPemasukan), trend: "+12.5%", type: "up" },
          { label: "Total Pengeluaran", icon: "red", value: money(totalPengeluaran), trend: "-4.2%", type: "down" },
          { label: "Saldo Bersih", icon: "blue", value: money(saldo), trend: "+8.1%", type: "up" },
          { label: "Transaksi", icon: "gold", value: String(state.transactions.length), trend: "+3", type: "up" }
        ];

        document.getElementById("statsGrid").innerHTML = cards.map(card => `
          <div class="stat-card">
            <div class="stat-top">
              <div class="stat-label">${card.label}</div>
              <div class="stat-icon ${card.icon}">${card.label[0]}</div>
            </div>
            <div class="stat-value">${card.value}</div>
            <div class="trend ${card.type}">${card.trend}</div>
          </div>
        `).join("");
      }

      function renderTable() {
        const tbody = document.getElementById("transactionTableBody");

        tbody.innerHTML = state.transactions.map(item => {
          const typeClass = item.type === "Pemasukan" ? "income" : item.type === "Pengeluaran" ? "expense" : "transfer";
          const amountClass = item.type === "Pemasukan" ? "in" : "out";
          const formattedAmount = `${item.type === "Pemasukan" ? "+" : "-"}${money(item.nominal)}`;

          return `
            <tr>
              <td>${item.date}</td>
              <td><span class="badge ${typeClass}">${item.type}</span></td>
              <td>${item.description}</td>
              <td>${item.account}</td>
              <td class="money ${amountClass}">${formattedAmount}</td>
            </tr>
          `;
        }).join("");
      }

      function resetState() {
        state.transactions = [
          { date: "2026-10-21", type: "Pemasukan", description: "Donasi sponsor utama", account: "Kas Tunai", nominal: 2500000 },
          { date: "2026-10-20", type: "Pengeluaran", description: "Pembelian dekorasi acara", account: "Kas Tunai", nominal: 950000 },
          { date: "2026-10-19", type: "Pemasukan", description: "Setoran dari bendahara", account: "Rekening Bank", nominal: 1800000 },
          { date: "2026-10-18", type: "Transfer", description: "Pindah dana ke kebutuhan logistik", account: "Rekening Bank", nominal: 1200000 },
          { date: "2026-10-17", type: "Pengeluaran", description: "Honor panitia & dokumentasi", account: "Kas Tunai", nominal: 700000 },
          { date: "2026-10-16", type: "Pemasukan", description: "Pendapatan tiket/pendaftaran", account: "Rekening Bank", nominal: 3200000 }
        ];
        renderSummary();
        renderTable();
      }

      function exportCsv() {
        const rows = [
          ["Tanggal", "Jenis", "Deskripsi", "Rekening", "Nominal"],
          ...state.transactions.map(item => [item.date, item.type, item.description, item.account, item.nominal])
        ];

        const csv = rows.map(row => row.map(value => `"${String(value).replace(/"/g, '""')}"`).join(",")).join("\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "kaspanitia-laporan-v21.csv";
        link.click();
        URL.revokeObjectURL(url);
      }

      function exportPdf() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: "pt", format: "a4" });
        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();
        const margin = 42;

        const totalPemasukan = state.transactions
          .filter(item => item.type === "Pemasukan")
          .reduce((sum, item) => sum + Number(item.nominal || 0), 0);

        const totalPengeluaran = state.transactions
          .filter(item => item.type === "Pengeluaran" || item.type === "Transfer")
          .reduce((sum, item) => sum + Number(item.nominal || 0), 0);

        const saldo = totalPemasukan - totalPengeluaran;

        doc.setFillColor(30, 91, 77);
        doc.rect(0, 0, pageWidth, 110, "F");

        doc.setTextColor(255, 255, 255);
        doc.setFontSize(22);
        doc.setFont("helvetica", "bold");
        doc.text("KasPanitia", margin, 40);
        doc.setFontSize(11);
        doc.setFont("helvetica", "normal");
        doc.text("Finance Portal", margin, 58);

        doc.setFillColor(255, 255, 255);
        doc.roundedRect(margin, 80, pageWidth - margin * 2, 62, 12, 12, "F");
        doc.setTextColor(22, 35, 33);
        doc.setFontSize(20);
        doc.setFont("helvetica", "bold");
        doc.text("Laporan Keuangan Panitia", margin + 16, 106);
        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");
        doc.text(`Tanggal cetak: ${new Date().toLocaleDateString("id-ID", { day: "2-digit", month: "long", year: "numeric" })}`, margin + 16, 122);

        const summaryY = 180;
        const summaryBoxWidth = (pageWidth - margin * 2 - 24) / 3;
        const summaryData = [
          ["Pemasukan", money(totalPemasukan), [50, 162, 80]],
          ["Pengeluaran", money(totalPengeluaran), [217, 76, 76]],
          ["Saldo", money(saldo), [45, 132, 200]]
        ];

        summaryData.forEach(([label, value, color], index) => {
          const x = margin + index * (summaryBoxWidth + 12);
          doc.setFillColor(color[0], color[1], color[2]);
          doc.roundedRect(x, summaryY, summaryBoxWidth, 60, 12, 12, "F");
          doc.setTextColor(255, 255, 255);
          doc.setFontSize(10);
          doc.setFont("helvetica", "normal");
          doc.text(label, x + 16, summaryY + 20);
          doc.setFontSize(15);
          doc.setFont("helvetica", "bold");
          doc.text(value, x + 16, summaryY + 42);
        });

        let currentY = 270;
        doc.setTextColor(22, 35, 33);
        doc.setFontSize(14);
        doc.setFont("helvetica", "bold");
        doc.text("Daftar Transaksi", margin, currentY);
        currentY += 22;

        const tableHeaders = ["Tanggal", "Jenis", "Deskripsi", "Rekening", "Nominal"];
        const columns = [70, 120, 250, 180, 90];
        const startX = margin;

        doc.setFillColor(245, 250, 248);
        doc.roundedRect(startX, currentY, pageWidth - margin * 2, 26, 8, 8, "F");
        doc.setTextColor(100, 117, 111);
        doc.setFontSize(9);
        doc.setFont("helvetica", "bold");
        tableHeaders.forEach((header, idx) => {
          const x = startX + columns.slice(0, idx).reduce((sum, w) => sum + w, 0) + 10;
          doc.text(header, x, currentY + 16);
        });

        currentY += 34;
        doc.setTextColor(22, 35, 33);
        doc.setFont("helvetica", "normal");

        state.transactions.forEach((item, index) => {
          if (currentY > pageHeight - 80) {
            doc.addPage();
            currentY = 52;
          }

          const rowColor = index % 2 === 0 ? [255, 255, 255] : [245, 250, 248];
          doc.setFillColor(rowColor[0], rowColor[1], rowColor[2]);
          doc.rect(startX, currentY, pageWidth - margin * 2, 24, "F");

          const values = [
            item.date,
            item.type,
            item.description,
            item.account,
            `${item.type === "Pemasukan" ? "+" : "-"}${money(item.nominal)}`
          ];

          values.forEach((value, idx) => {
            const x = startX + columns.slice(0, idx).reduce((sum, w) => sum + w, 0) + 10;
            doc.text(String(value), x, currentY + 15, { maxWidth: columns[idx] - 10 });
          });

          currentY += 24;
        });

        doc.setTextColor(100, 117, 111);
        doc.setFontSize(10);
        doc.text("Generated by KasPanitia Premium v21", margin, pageHeight - 28);
        doc.text("© 2026 KasPanitia", pageWidth - 130, pageHeight - 28);

        doc.save("kaspanitia-laporan-v21.pdf");
      }

      document.getElementById("exportCsvBtn").addEventListener("click", exportCsv);
      document.getElementById("downloadPdfBtn").addEventListener("click", exportPdf);
      document.getElementById("resetDataBtn").addEventListener("click", resetState);

      renderSummary();
      renderTable();
    </script>
  </body>
</html>
