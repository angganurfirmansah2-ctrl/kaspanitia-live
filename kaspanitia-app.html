<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KasPanitia Live</title>
    <style>
      :root {
        --bg: #f3f7f5;
        --panel: #ffffff;
        --panel-soft: #f8fbfa;
        --primary: #1d5848;
        --primary-2: #173e36;
        --primary-soft: #eaf4f0;
        --text: #1c2826;
        --muted: #62736d;
        --line: #dfe9e3;
        --success: #197d4d;
        --danger: #c94d4d;
        --warning: #b97b1d;
        --info: #2d6ec8;
        --shadow: 0 12px 28px rgba(18, 38, 29, 0.08);
        --radius: 16px;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      a { color: inherit; text-decoration: none; }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }

      .hidden { display: none !important; }
      .app-shell {
        display: grid;
        grid-template-columns: 260px 1fr;
        min-height: 100vh;
      }

      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        background: linear-gradient(180deg, var(--primary-2), var(--primary));
        color: white;
        padding: 20px 16px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 8px 18px;
        border-bottom: 1px solid rgba(255,255,255,0.14);
        margin-bottom: 12px;
      }
      .brand-badge {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: rgba(255,255,255,0.12);
        font-weight: 800;
      }
      .brand-title { font-weight: 700; font-size: 1.1rem; }
      .brand-sub { font-size: 0.74rem; color: rgba(255,255,255,0.72); }

      .user-box {
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        padding: 10px 12px;
        margin: 12px 0 18px;
      }
      .label-mini {
        font-size: 0.68rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.8);
        display: inline-block;
        margin-bottom: 8px;
      }
      .user-select {
        width: 100%;
        border: none;
        background: transparent;
        color: #fff;
        outline: none;
        font-size: 0.95rem;
      }
      .user-select option { color: #111; }

      .nav {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .nav-btn {
        width: 100%;
        border: none;
        background: transparent;
        color: rgba(255,255,255,0.85);
        border-radius: 12px;
        padding: 11px 12px;
        text-align: left;
        font-weight: 700;
        transition: 0.2s ease;
      }
      .nav-btn:hover { background: rgba(255,255,255,0.06); }
      .nav-btn.active {
        background: rgba(255,255,255,0.12);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      }

      .main {
        padding: 26px 26px 40px;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .search-box {
        flex: 1;
        min-width: 220px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: var(--shadow);
      }
      .search-box input {
        width: 100%;
        border: none;
        outline: none;
        background: transparent;
        color: var(--text);
      }

      .right-tools {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .chip {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 12px;
        font-weight: 700;
        color: var(--muted);
      }
      .chip.primary {
        background: var(--primary-soft);
        color: var(--primary);
      }
      .user-pill {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 8px 10px;
        box-shadow: var(--shadow);
      }
      .avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: linear-gradient(135deg, #dfeeee, #a7d4bf);
        display: grid;
        place-items: center;
        font-weight: 800;
        color: var(--primary);
      }
      .user-pill strong { display: block; font-size: 0.88rem; }
      .user-pill small { color: var(--muted); font-size: 0.72rem; }

      .header-block {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .page-title { margin: 0; font-size: clamp(1.7rem, 3vw, 2.3rem); }
      .page-subtitle { margin: 6px 0 0; color: var(--muted); }
      .status-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .status-chip {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 12px;
        color: var(--muted);
        font-weight: 700;
      }
      .status-chip.active {
        background: var(--primary-soft);
        color: var(--primary);
        border-color: rgba(29, 88, 72, 0.18);
      }

      .section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 18px;
        margin-bottom: 18px;
      }
      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 14px;
      }
      .section-header h3 {
        margin: 0;
        font-size: 1.05rem;
      }
      .muted { color: var(--muted); }
      .summary-box {
        background: var(--primary-soft);
        border-left: 4px solid var(--primary);
        border-radius: 10px;
        padding: 12px 14px;
        color: var(--primary);
        font-weight: 700;
        margin-bottom: 18px;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 14px;
        margin-bottom: 18px;
      }
      .stat-card {
        background: linear-gradient(180deg, #fff, #f3faf7);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
        min-height: 120px;
      }
      .stat-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 14px;
      }
      .stat-label {
        color: var(--muted);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .stat-icon {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 1.05rem;
      }
      .icon-green { background: #eafaf0; color: var(--success); }
      .icon-red { background: #fdecec; color: var(--danger); }
      .icon-blue { background: #edf4ff; color: var(--info); }
      .icon-gold { background: #fff3df; color: var(--warning); }
      .stat-value {
        font-size: clamp(1.4rem, 2vw, 1.9rem);
        font-weight: 800;
      }
      .trend {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 10px;
        padding: 5px 8px;
        border-radius: 999px;
        font-size: 0.74rem;
        font-weight: 700;
      }
      .trend.up { background: #eafaf0; color: var(--success); }
      .trend.down { background: #fdecec; color: var(--danger); }

      .main-grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 18px;
        margin-bottom: 18px;
      }
      .chart-wrap {
        height: 220px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 4px 0;
      }
      .bar-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: end;
        gap: 8px;
        flex: 1;
        height: 100%;
      }
      .bar {
        width: 100%;
        max-width: 42px;
        border-radius: 12px 12px 0 0;
        background: linear-gradient(180deg, #bfe5c9, var(--primary));
        min-height: 32px;
      }
      .bar.alt { background: linear-gradient(180deg, #d8f4e3, #7fbc9d); }
      .bar-label { color: var(--muted); font-size: 0.72rem; }
      .mini-list { display: flex; flex-direction: column; gap: 12px; }
      .mini-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 8px;
        border-radius: 12px;
        background: #f9fbfa;
      }
      .mini-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      .mini-item strong { display: block; }
      .mini-item small { color: var(--muted); }
      .mini-item .value { margin-left: auto; font-weight: 700; }

      .table-wrap { overflow-x: auto; }
      table {
        width: 100%;
        min-width: 760px;
        border-collapse: collapse;
      }
      th, td {
        text-align: left;
        padding: 12px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      th {
        background: #fafcfb;
        color: var(--muted);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      tbody tr:hover { background: #f9fbfa; }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
      }
      .badge.income { background: #eafaf0; color: var(--success); }
      .badge.expense { background: #fdecec; color: var(--danger); }
      .badge.transfer { background: #edf4ff; color: var(--info); }
      .badge.status-diajukan { background: #fff4df; color: var(--warning); }
      .badge.status-disetujui { background: #eafaf0; color: var(--success); }
      .badge.status-perlu-revisi { background: #fff1f1; color: var(--danger); }
      .badge.status-ditolak { background: #ffecef; color: var(--danger); }
      .badge.status-dicairkan { background: #e7faf4; color: var(--primary); }

      .money { font-weight: 700; }
      .money.in { color: var(--success); }
      .money.out { color: var(--danger); }
      .btn{
        border: none;
        border-radius: 10px;
        padding: 10px 14px;
        font-weight: 700;
      }
      .btn.primary { background: var(--primary); color: white; }
      .btn.primary:hover { background: var(--primary-2); }
      .btn.secondary { background: var(--primary-soft); color: var(--primary); border: 1px solid var(--line); }
      .btn.warning { background: #fff4df; color: var(--warning); border: 1px solid #efd3a0; }
      .btn.danger { background: #fff0f0; color: var(--danger); border: 1px solid #efcaca; }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .field { display: flex; flex-direction: column; gap: 8px; }
      .field.full { grid-column: 1 / -1; }
      label {
        display: block;
        color: var(--primary);
        font-size: 0.8rem;
        font-weight: 700;
      }
      input, select, textarea {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: white;
        padding: 10px 12px;
        color: var(--text);
        outline: none;
      }
      textarea { min-height: 90px; resize: vertical; }
      .upload-box {
        text-align: center;
        border: 1.5px dashed #d2e2d8;
        background: #f7faf8;
        border-radius: 10px;
        padding: 18px 14px;
      }
      .upload-label {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--primary);
        color: white;
        border-radius: 10px;
        padding: 10px 14px;
        margin-top: 12px;
        cursor: pointer;
        font-weight: 700;
      }
      .file-preview {
        display: none;
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        background: #edf8f1;
        color: var(--primary);
        font-weight: 700;
      }
      .file-preview.show { display: block; }
      .empty {
        padding: 24px;
        text-align: center;
        color: var(--muted);
        border: 1px dashed var(--line);
        border-radius: 12px;
        background: #fbfdfc;
      }
      .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
      .list-card {
        background: var(--panel-soft);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
      }
      .mini-label {
        font-size: 0.72rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 8px;
      }
      .big-number {
        font-size: 1.8rem;
        font-weight: 800;
      }

      @media (max-width: 900px) {
        .app-shell { grid-template-columns: 1fr; }
        .sidebar {
          position: sticky;
          top: 0;
          height: auto;
          z-index: 10;
        }
        .main { padding: 18px 16px 28px; }
        .main-grid, .grid-2 { grid-template-columns: 1fr; }
      }

      @media (max-width: 560px) {
        .form-grid { grid-template-columns: 1fr; }
        .right-tools { width: 100%; justify-content: space-between; }
        .user-pill { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-badge">K</div>
          <div>
            <div class="brand-title">KasPanitia</div>
            <div class="brand-sub">Finance Portal</div>
          </div>
        </div>

        <div class="user-box">
          <span class="label-mini">Pengguna</span>
          <select id="userSelect" class="user-select"></select>
        </div>

        <nav id="nav" class="nav"></nav>
      </aside>

      <main class="main">
        <div class="topbar">
          <div class="search-box">
            <span>🔎</span>
            <input id="globalSearch" type="text" placeholder="Cari transaksi, pengajuan, atau bukti..." />
          </div>

          <div class="right-tools">
            <div class="chip primary">Live Data</div>
            <div class="chip">Notifikasi</div>
            <button class="btn primary" id="quickAction" type="button">+ Buat Transaksi</button>
            <div class="user-pill">
              <div class="avatar" id="userAvatar">B</div>
              <div>
                <strong id="userRoleTop">Bendahara</strong>
                <small id="userNameTop">Budi</small>
              </div>
            </div>
          </div>
        </div>

        <div class="header-block">
          <div>
            <h1 id="pageTitle" class="page-title">Dashboard</h1>
            <p id="pageSubtitle" class="page-subtitle">Monitoring keuangan dan realisasi anggaran</p>
          </div>
          <div class="status-row">
            <button class="status-chip active" type="button">Hari Ini</button>
            <button class="status-chip" type="button">Minggu Ini</button>
            <button class="status-chip" type="button">Bulan Ini</button>
            <button class="status-chip" type="button">Kustom</button>
          </div>
        </div>

        <div id="screen-dashboard" class="screen"></div>
        <div id="screen-rab" class="screen hidden"></div>
        <div id="screen-pengajuan" class="screen hidden"></div>
        <div id="screen-transaksi" class="screen hidden"></div>
        <div id="screen-laporan" class="screen hidden"></div>
        <div id="screen-audit" class="screen hidden"></div>
        <div id="screen-users" class="screen hidden"></div>
      </main>
    </div>

    <script>
      const STORAGE_KEY = "kaspanitia-live-v1";
      const defaultState = {
        currentUserId: "u-bendahara",
        users: [
          { id: "u-admin", name: "Admin Sistem", email: "admin@kaspanitia.id", role: "Admin", divisi: "-" },
          { id: "u-ketua", name: "Rina Ketua", email: "ketua@kaspanitia.id", role: "Ketua Panitia", divisi: "-" },
          { id: "u-bendahara", name: "Budi Bendahara", email: "bendahara@kaspanitia.id", role: "Bendahara", divisi: "-" },
          { id: "u-divisi-acara", name: "Ayu Acara", email: "acara@kaspanitia.id", role: "Koordinator Divisi", divisi: "Acara" },
          { id: "u-divisi-humas", name: "Dian Humas", email: "humas@kaspanitia.id", role: "Koordinator Divisi", divisi: "Humas" }
        ],
        accounts: [
          { id: "acc-cash", name: "Kas Tunai", type: "Kas Tunai", saldoAwal: 1500000 },
          { id: "acc-bank", name: "Rekening Bank", type: "Rekening Bank", saldoAwal: 8000000 }
        ],
        divisions: [
          { id: "div-acara", name: "Acara", coordinator: "Ayu Acara" },
          { id: "div-humas", name: "Humas", coordinator: "Dian Humas" },
          { id: "div-logistik", name: "Logistik", coordinator: "Budi Bendahara" }
        ],
        rab: [
          { id: "rab-1", division: "Acara", category: "Sewa Venue", amount: 4000000, notes: "Auditorium utama" },
          { id: "rab-2", division: "Acara", category: "Honor MC", amount: 1500000, notes: "Pembawa acara" },
          { id: "rab-3", division: "Humas", category: "Promosi & Media", amount: 2200000, notes: "Poster, iklan, desain" },
          { id: "rab-4", division: "Logistik", category: "Perlengkapan", amount: 3200000, notes: "Dekorasi, meja, kursi" }
        ],
        submissions: [
          { id: "sub-1", requestorId: "u-divisi-acara", division: "Acara", title: "Pembelian konsumsi undangan", category: "Konsumsi", nominal: 2500000, date: "2026-10-23", status: "Diajukan", notes: "Untuk konsumsi peserta dan panitia", attachment: "lampiran-1.pdf" },
          { id: "sub-2", requestorId: "u-divisi-humas", division: "Humas", title: "Cetak banner event", category: "Promosi", nominal: 1200000, date: "2026-10-21", status: "Disetujui", notes: "Banner untuk pengumuman di kampus", attachment: "lampiran-2.pdf" }
        ],
        transactions: [
          { id: "tx-1", date: "2026-10-10", description: "Pendaftaran sponsor", type: "Pemasukan", category: "Sponsor", accountId: "acc-bank", division: "Acara", nominal: 6000000, status: "Diposting" },
          { id: "tx-2", date: "2026-10-12", description: "Pembelian dekorasi", type: "Pengeluaran", category: "Logistik", accountId: "acc-cash", division: "Logistik", nominal: 1200000, status: "Diposting" },
          { id: "tx-3", date: "2026-10-15", description: "Transfer ke kas acara", type: "Transfer", category: "Internal", accountId: "acc-bank", fromAccountId: "acc-bank", toAccountId: "acc-cash", division: "Acara", nominal: 1500000, status: "Diposting" }
        ],
        auditLog: [
          { id: "log-1", time: "2026-10-10 09:15", actor: "Budi Bendahara", action: "Posting transaksi", detail: "Pendaftaran sponsor masuk ke rekening bank" },
          { id: "log-2", time: "2026-10-12 14:00", actor: "Ayu Acara", action: "Pengajuan dana", detail: "Pengajuan konsumsi undangan dibuat" },
          { id: "log-3", time: "2026-10-15 11:20", actor: "Budi Bendahara", action: "Transfer internal", detail: "Transfer dari rekening bank ke kas tunai" }
        ]
      };

      let activeScreen = "dashboard";
      let state = loadState();

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultState));
            return structuredClone(defaultState);
          }
          const parsed = JSON.parse(raw);
          if (!parsed || !parsed.users) throw new Error("invalid");
          return parsed;
        } catch {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultState));
          return structuredClone(defaultState);
        }
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function parseNumber(v) {
        const n = Number(v);
        return Number.isFinite(n) ? n : 0;
      }

      function formatCurrency(value) {
        return new Intl.NumberFormat("id-ID", {
          style: "currency",
          currency: "IDR",
          maximumFractionDigits: 0
        }).format(parseNumber(value));
      }

      function formatDate(dateString) {
        if (!dateString) return "-";
        const d = new Date(dateString + "T00:00:00");
        if (Number.isNaN(d.getTime())) return dateString;
        return d.toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "numeric" });
      }

      function getCurrentUser() {
        return state.users.find(u => u.id === state.currentUserId) || state.users[0];
      }

      function getUserById(id) {
        return state.users.find(u => u.id === id);
      }

      function getAccountById(id) {
        return state.accounts.find(a => a.id === id);
      }

      function canAccess(key) {
        const role = getCurrentUser().role;
        const map = {
          dashboard: ["Admin", "Ketua Panitia", "Koordinator Divisi", "Bendahara"],
          rab: ["Bendahara", "Ketua Panitia"],
          pengajuan: ["Koordinator Divisi", "Bendahara", "Ketua Panitia"],
          transaksi: ["Bendahara"],
          laporan: ["Bendahara", "Ketua Panitia", "Admin"],
          audit: ["Admin", "Bendahara", "Ketua Panitia"],
          users: ["Admin"]
        };
        return (map[key] || []).includes(role);
      }

      function recordAudit(action, detail) {
        state.auditLog.unshift({
          id: "log-" + Date.now(),
          time: new Date().toLocaleString("sv-SE").replace(" ", " "),
          actor: getCurrentUser().name,
          action,
          detail
        });
        saveState();
      }

      function getAccountBalance(accountId) {
        const account = getAccountById(accountId);
        if (!account) return 0;
        let total = parseNumber(account.saldoAwal);

        state.transactions.forEach(tx => {
          if (tx.accountId === accountId && tx.type === "Pemasukan") total += parseNumber(tx.nominal);
          if (tx.accountId === accountId && tx.type === "Pengeluaran") total -= parseNumber(tx.nominal);
          if (tx.fromAccountId === accountId && tx.type === "Transfer") total -= parseNumber(tx.nominal);
          if (tx.toAccountId === accountId && tx.type === "Transfer") total += parseNumber(tx.nominal);
        });

        return total;
      }

      function totalPemasukan() {
        return state.transactions
          .filter(tx => tx.type === "Pemasukan")
          .reduce((sum, tx) => sum + parseNumber(tx.nominal), 0);
      }

      function totalPengeluaran() {
        return state.transactions
          .filter(tx => tx.type === "Pengeluaran")
          .reduce((sum, tx) => sum + parseNumber(tx.nominal), 0);
      }

      function totalAnggaran() {
        return state.rab.reduce((sum, item) => sum + parseNumber(item.amount), 0);
      }

      function totalMenungguPersetujuan() {
        return state.submissions.filter(s => ["Diajukan", "Perlu Revisi"].includes(s.status)).length;
      }

      function statusBadgeClass(status) {
        const normalized = String(status || "").trim().toLowerCase().replace(/\s+/g, "-");
        return "badge status-" + normalized;

                <div class="mini-label">Pengeluaran</div>
                <div class="big-number">${formatCurrency(expense)}</div>
              </div>
              <div class="list-card">
                <div class="mini-label">Saldo Kas</div>
                <div class="big-number">${formatCurrency(cash)}</div>
              </div>
              <div class="list-card">
                <div class="mini-label">Saldo Bank</div>
                <div class="big-number">${formatCurrency(bank)}</div>
              </div>
            </div>

            <div style="margin-top:20px;">
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Divisi</th>
                      <th>RAB</th>
                      <th>Realisasi</th>
                      <th>Sisa</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${state.divisions.map(div => {
                      const rabTotal = state.rab.filter(r => r.division === div.name).reduce((sum, r) => sum + parseNumber(r.amount), 0);
                      const realized = state.transactions.filter(tx => tx.division === div.name && tx.type === "Pengeluaran").reduce((sum, tx) => sum + parseNumber(tx.nominal), 0);
                      return `
                        <tr>
                          <td>${div.name}</td>
                          <td>${formatCurrency(rabTotal)}</td>
                          <td>${formatCurrency(realized)}</td>
                          <td>${formatCurrency(rabTotal - realized)}</td>
                        </tr>
                      `;
                    }).join("")}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      }

      function renderAudit() {
        if (!canAccess("audit")) return;

        document.getElementById("screen-audit").innerHTML = `
          <div class="section">
            <div class="section-header">
              <h3>Audit Log</h3>
              <span class="muted">Jejak aktivitas</span>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Waktu</th>
                    <th>Pengguna</th>
                    <th>Aksi</th>
                    <th>Detail</th>
                  </tr>
                </thead>
                <tbody>
                  ${state.auditLog.map(log => `
                    <tr>
                      <td>${log.time}</td>
                      <td>${log.actor}</td>
                      <td>${log.action}</td>
                      <td>${log.detail}</td>
                    </tr>
                  `).join("") || `<tr><td colspan="4"><div class="empty">Belum ada log audit.</div></td></tr>`}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      function renderUsers() {
        if (!canAccess("users")) return;

        document.getElementById("screen-users").innerHTML = `
          <div class="section">
            <div class="section-header">
              <h3>Kelola Pengguna</h3>
              <span class="muted">Admin only</span>
            </div>

            <form id="userForm">
              <div class="form-grid">
                <div class="field">
                  <label>Nama</label>
                  <input type="text" name="name" required />
                </div>
                <div class="field">
                  <label>Email</label>
                  <input type="email" name="email" required />
                </div>
                <div class="field">
                  <label>Role</label>
                  <select name="role" required>
                    <option value="Admin">Admin</option>
                    <option value="Ketua Panitia">Ketua Panitia</option>
                    <option value="Koordinator Divisi">Koordinator Divisi</option>
                    <option value="Bendahara">Bendahara</option>
                  </select>
                </div>
                <div class="field">
                  <label>Divisi</label>
                  <input type="text" name="divisi" placeholder="Opsional" />
                </div>
              </div>
              <div style="margin-top:12px;">
                <button class="btn primary" type="submit">Tambah User</button>
              </div>
            </form>

            <div style="margin-top:20px;">
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Nama</th>
                      <th>Email</th>
                      <th>Role</th>
                      <th>Divisi</th>
                      <th>Aksi</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${state.users.map(user => `
                      <tr>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td>${user.role}</td>
                        <td>${user.divisi || "-"}</td>
                        <td><button class="btn danger btn-delete-user" data-id="${user.id}" ${user.id === state.currentUserId ? "disabled" : ""}>Hapus</button></td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;

        document.getElementById("userForm").addEventListener("submit", (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const name = String(fd.get("name") || "").trim();
          const email = String(fd.get("email") || "").trim();
          const role = String(fd.get("role") || "").trim();
          const divisi = String(fd.get("divisi") || "").trim();

          if (!name || !email || !role) {
            alert("Nama, email, dan role wajib diisi.");
            return;
          }

          state.users.push({
            id: "u-" + Date.now(),
            name,
            email,
            role,
            divisi: divisi || "-"
          });

          saveState();
          recordAudit("Tambah user", `${name} (${role})`);
          render();
        });

        document.querySelectorAll(".btn-delete-user").forEach(button => {
          button.addEventListener("click", () => {
            const id = button.dataset.id;
            if (id === state.currentUserId) {
              alert("Tidak bisa menghapus user yang sedang aktif.");
              return;
            }
            state.users = state.users.filter(u => u.id !== id);
            saveState();
            recordAudit("Hapus user", `User dihapus dari sistem`);
            render();
          });
        });
      }

      function attachStaticEvents() {
        const searchInput = document.getElementById("globalSearch");
        if (searchInput) {
          searchInput.oninput = (e) => {
            const keyword = e.target.value.trim().toLowerCase();
            const rows = document.querySelectorAll("tbody tr");
            rows.forEach(row => {
              const text = row.textContent.toLowerCase();
              row.style.display = (!keyword || text.includes(keyword)) ? "" : "none";
            });
          };
        }

        const quickAction = document.getElementById("quickAction");
        if (quickAction) {
          quickAction.onclick = () => {
            activeScreen = "transaksi";
            render();
          };
        }
      }

      function render() {
        renderScreenVisibility();
        renderNav();
        updateHeaderMeta();

        if (canAccess("dashboard")) renderDashboard();
        if (canAccess("rab")) renderRab();
        if (canAccess("pengajuan")) renderPengajuan();
        if (canAccess("transaksi")) renderTransaksi();
        if (canAccess("laporan")) renderLaporan();
        if (canAccess("audit")) renderAudit();
        if (canAccess("users")) renderUsers();
      }

      attachStaticEvents();
      render();
    </script>
  </body>
</html>
